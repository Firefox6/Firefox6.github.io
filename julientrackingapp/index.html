<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101620">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tracking">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Julien Tracking</title>
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyeline">Julien Tracking</p>
          <h1 id="screen-title">Dashboard</h1>
        </div>
        <button class="icon-button" type="button" data-global-action="sync-render" aria-label="Aktualisieren" title="Aktualisieren">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1"/>
            <path d="M20 5v5h-5M4 19v-5h5"/>
          </svg>
        </button>
      </header>

      <main id="app" class="screen" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Hauptnavigation">
        <button class="nav-item is-active" type="button" data-tab="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M9 20v-6h6v6"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" type="button" data-tab="weight">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l1.5 13h-15L6 7Z"/><path d="M8 7a4 4 0 0 1 8 0"/><path d="M12 11v3"/></svg>
          <span>Gewicht</span>
        </button>
        <button class="nav-item" type="button" data-tab="calories">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18"/><path d="M5 3v6a2 2 0 0 0 4 0V3"/><path d="M15 3v18"/><path d="M15 3a4 4 0 0 1 4 4v4h-4"/></svg>
          <span>Kalorien</span>
        </button>
        <button class="nav-item" type="button" data-tab="training">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4"/><path d="M7 7v10"/><path d="M17 7v10"/><path d="M21 10v4"/><path d="M7 12h10"/></svg>
          <span>Training</span>
        </button>
        <button class="nav-item" type="button" data-tab="more">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M4 12h.01M20 12h.01M12 4v.01M12 20v.01M6.3 6.3h.01M17.7 17.7h.01M17.7 6.3h.01M6.3 17.7h.01"/></svg>
          <span>Mehr</span>
        </button>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
