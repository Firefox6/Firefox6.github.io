<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Apps</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            text-decoration: none;
            color: #2c3e50;
            background: #eef2f3;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        a:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Projekt-Übersicht</h1>
    <div class="links">
        <a href="https://firefox6.github.io/fussball-tracker" target="_blank">⚽ Fussball Tracker</a>
        <a href="https://firefox6.github.io/julientrackingapp" target="_blank">📊 Julien Tracking App</a>
        <a href="https://firefox6.github.io/pouchinator" target="_blank">🦘 Pouchinator</a>
    </div>
</div>

</body>
</html>
